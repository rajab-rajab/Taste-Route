<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>TasteRoute</title><link rel="stylesheet" href="/styles.css" /></head>
<body><main><p class="eyebrow">QLOO-POWERED CULTURAL ROUTING AGENT</p><h1>Turn your taste into a route worth taking.</h1><p class="intro">TasteRoute resolves cultural references, reads Qloo taste signals, and plans an outing matched to your city, mood, and goal.</p><section class="panel"><form id="route-form"><label>Public cultural reference<input name="seed" placeholder="e.g. Khruangbin, Parasite, street food" required /></label><div class="grid"><label>City or area<input name="city" placeholder="e.g. Lahore" /></label><label>Desired mood<select name="mood"><option value="">Surprise me</option><option>Cozy and low-key</option><option>Curious and creative</option><option>Social and energetic</option></select></label></div><label>What should the agent plan?<select name="goal"><option value="discovery">A cultural discovery route</option><option value="dining">A dining route</option><option value="music">A live-music route</option><option value="film">A film route</option></select></label><p class="privacy">Use public cultural references only. Do not enter personal or sensitive information.</p><button type="submit">Ask the TasteRoute agent</button></form></section><section id="result" class="result" aria-live="polite"></section></main><template id="card-template"><article class="card"><p class="type"></p><h2></h2><p class="reason"></p></article></template><script src="/app.js"></script></body></html>
